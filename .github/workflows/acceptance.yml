name: Editorial acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: folio_ci
          POSTGRES_USER: folio_ci
          POSTGRES_PASSWORD: isolated-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U folio_ci -d folio_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned application and test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Build the React desk
        run: |
          npm --prefix web ci --no-audit --no-fund
          npm --prefix web run build
      - name: Prepare Chinese fonts and Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m playwright install --with-deps chromium
      - name: Check migrations and SQLite behaviour
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test desk --verbosity 2
      - name: Verify PostgreSQL and browser downloads
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: folio_ci
          PGDATABASE: folio_ci
          PGPASSWORD: isolated-ci-only
        run: |
          python manage.py migrate --noinput
          python manage.py migrate --check
          python manage.py test desk tests_ui --verbosity 2
