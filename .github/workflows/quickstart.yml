name: Local quickstart

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: ci-quickstart-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and start the desk from the user entry point
        run: |
          python -m pip install pexpect==4.9.0
          python tests_startup/smoke.py
      - name: Show service errors
        if: failure()
        run: docker compose logs --no-color --tail=80 web worker
      - name: Remove isolated test containers
        if: always()
        run: docker compose down -v
  windows-entry:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Windows command and failure propagation with a Docker CLI stub
        shell: pwsh
        run: |
          $stub = Join-Path $env:RUNNER_TEMP "launcher-cli"
          New-Item -ItemType Directory $stub | Out-Null
          @'
          @echo off
          echo %*>>"%TEMP%\launcher-cli.log"
          if "%2"=="%FAIL_AT%" exit /b 1
          exit /b 0
          '@ | Set-Content "$stub\docker.cmd" -Encoding ascii
          $env:PATH = "$stub;$env:PATH"
          Set-Location $env:RUNNER_TEMP
          foreach ($stage in @("version", "up", "exec", "success")) {
            Remove-Item "$env:TEMP\launcher-cli.log" -ErrorAction SilentlyContinue
            $env:FAIL_AT = $stage
            & "$env:GITHUB_WORKSPACE\start.cmd"
            $expectedCode = [int]($stage -ne "success")
            if ($LASTEXITCODE -ne $expectedCode) { throw "Unexpected exit at $stage" }
            $actual = @(Get-Content "$env:TEMP\launcher-cli.log")
            $all = @("compose version", "compose up --build --wait -d", "compose exec web python manage.py first_reviewer")
            $count = @{version=1; up=2; exec=3; success=3}[$stage]
            if (($actual -join "|") -ne (($all | Select-Object -First $count) -join "|")) { throw "Wrong calls at $stage" }
          }
          exit 0
